<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Plan 规聚</title>
    <script>
      window.__oawNativeFileReader = window.FileReader;
      window.__oawNativeFile = window.File;
      window.__oawNativeBlob = window.Blob;
      window.__oawNativeFileList = window.FileList;
    </script>
    <script>
      // 系统"减少动效"偏好同步到 <html data-reduce-motion>，且必须在首帧前完成：
      // CSS 动效闸门因此只需要一个属性选择器，不必在样式表里重复维护两份关闭清单。
      try {
        var reduceQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
        var syncReduceMotion = function () {
          document.documentElement.dataset.reduceMotion = reduceQuery.matches ? "1" : "";
        };
        syncReduceMotion();
        if (reduceQuery.addEventListener) reduceQuery.addEventListener("change", syncReduceMotion);
        else if (reduceQuery.addListener) reduceQuery.addListener(syncReduceMotion);
      } catch (error) {}
    </script>
    <script>
      // 首帧预置主题与皮肤（计划 2026-11-18-001 / PRD R8「切换不闪白」）：
      // 必须先于 main.jsx 挂载执行，避免亮色用户刷新时先渲染暗色再跳亮色。
      // 白名单与 client/src/theme.jsx 的 THEMES/SKINS 保持同步（test:theme-appearance 守护）。
      (function () {
        var THEMES = ["dark", "light"];
        var SKINS = ["proma", "glass", "default", "ocean", "forest", "sunset", "violet"];
        var theme = "dark";
        var skin = "default";
        try {
          var savedTheme = window.localStorage.getItem("oaw_theme");
          if (THEMES.indexOf(savedTheme) !== -1) theme = savedTheme;
          var savedSkin = window.localStorage.getItem("oaw_skin");
          if (SKINS.indexOf(savedSkin) !== -1) skin = savedSkin;
        } catch (error) {}
        try {
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.skin = skin;
        } catch (error) {}
      })();
    </script>
    <link rel="icon" href="/规聚标志.svg" />
  </head>
  <body>
    <div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:12px;font-family:system-ui;color:var(--muted, #8a8fa3);background:var(--body-bg, #1a1a2e)"><img width="36" height="36" src="/规聚标志.svg" alt="Open Plan" /><div>Open Plan 规聚 · 正在加载…</div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
