name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装依赖（服务端）
        run: npm ci --no-audit --no-fund

      - name: 安装依赖（前端）
        run: npm --prefix client ci --no-audit --no-fund

      - name: 构建前端
        run: npm run build

      - name: 执行轨迹归约（工具聚合 / 完成语义 / 每轮用时与 token）
        run: node scripts/CI运行测试.mjs 执行轨迹归约测试

      - name: 事件注册表一致性
        run: node scripts/CI运行测试.mjs 事件注册表测试

      - name: 任务结论事件流
        run: node scripts/CI运行测试.mjs 任务结论事件流测试

      - name: 成果可信度（归属分层 / 回滚与固定口径）
        run: node scripts/CI运行测试.mjs 成果可信度测试

      - name: 动效治理（持续动画白名单与降级）
        run: node scripts/CI运行测试.mjs 动效治理测试

      - name: 主任务流（交互与结果卡）
        run: node scripts/CI运行测试.mjs 主任务流可信度测试

      - name: 对话流（过程折叠 / 产物卡片 / 结论内嵌）
        run: node scripts/CI运行测试.mjs 对话流性能回归测试

      - name: AVA 对话状态可信（压缩禁发 / 停止队列回执 / 发送三态）
        run: node scripts/CI运行测试.mjs AVA对话状态可信测试

      - name: AVA 对话队列（折叠预览 / 编辑删除 / 提升插话）
        run: node scripts/CI运行测试.mjs AVA对话队列测试

      - name: AVA 草稿持久化（localStorage / 隐私降级 / 会话隔离）
        run: node scripts/CI运行测试.mjs AVA草稿持久化测试

      - name: AVA 历史分页（活跃 leaf / 游标续拉 / 滚动锚点）
        run: node scripts/CI运行测试.mjs AVA历史分页测试

      - name: AVA 消息版本（编辑分支 / fork / regenerate）
        run: node scripts/CI运行测试.mjs AVA消息版本测试

      - name: AVA 长期目标（六状态 / 预算统计 / /goal）
        run: node scripts/CI运行测试.mjs AVA长期目标测试

      - name: AVA 链接页签（提取去重 / 角标 / 空态）
        run: node scripts/CI运行测试.mjs AVA链接页签测试

      - name: AVA 输入增强（推理全档位 / # 提及）
        run: node scripts/CI运行测试.mjs AVA输入增强测试

      - name: AVA Schema 提问表单（字段 / values / 校验）
        run: node scripts/CI运行测试.mjs AVA提问表单测试

      - name: AVA 会话分组（分页 / 工作区 / 20 条）
        run: node scripts/CI运行测试.mjs AVA会话分组测试

      - name: AVA 智能体提及（触发转义 / 角色注入 / 会话继承）
        run: node scripts/CI运行测试.mjs AVA提及测试

      - name: AVA 欢迎页（点击即发送 / 端点回退 / 模式语义）
        run: node scripts/CI运行测试.mjs AVA欢迎页测试

      - name: AVA 时间线与运行态（TurnRail 门槛 / 未读 / 运行图标 / 顶栏搜索）
        run: node scripts/CI运行测试.mjs AVA时间线测试

      - name: AVA 附件与工作区菜单（音视频 / 拖拽 / 归档不删磁盘）
        run: node scripts/CI运行测试.mjs AVA附件测试

      - name: AVA 画布页签（文件树 / 新会话 / 切换不卸载 / 宽度约束）
        run: node scripts/CI运行测试.mjs AVA画布页签测试

      - name: 长连接预算与流去重（切工作区/切会话卡死防护）
        run: node scripts/CI运行测试.mjs 长连接预算与流去重测试

      - name: 地图只读能力与临时层（阶段 0 地基）
        run: node scripts/CI运行测试.mjs 地图只读能力与临时层测试

      - name: 地图图层模型与入口（阶段 1：归属 / 选择器 / 审批 / 分组）
        run: node scripts/CI运行测试.mjs 地图图层模型与入口测试

      - name: 交通数据源与可视化描述符（阶段 5 + 阶段 2.1）
        run: node scripts/CI运行测试.mjs 交通数据源与可视化描述符测试

      - name: 地图可视化统一与面板整合（阶段 2：面板下线 / 顶栏收敛）
        run: node scripts/CI运行测试.mjs 地图可视化统一与面板整合测试

      - name: 地图对话栏适配（阶段 4：紧凑呈现 / 状态行 / 临时层提示）
        run: node scripts/CI运行测试.mjs 地图对话栏适配测试

      - name: 工作区隔离（地图项目生命周期）
        run: node scripts/CI运行测试.mjs 工作区隔离回归测试

      - name: Pi 内置供应商目录与一键添加（登录方式区分 / 能力自动带出）
        run: node scripts/CI运行测试.mjs 供应商目录与一键导入测试

      - name: Review 报错修复（officecli 参数 / 临时文件 / 输入区布局）
        run: node scripts/CI运行测试.mjs Review报错修复回归测试

      - name: Office 写作契约（四路由 / 澄清 / 模板 / 版式 / 闸门）
        run: node scripts/CI运行测试.mjs Office写作契约回归测试

      # 契约层与并发回归：2026-11-01 收敛时发现这些此前不在 CI 里，
      # 导致"后加工具没同步元数据表""写入撞锁立即失败"等问题长期无人发现。
      - name: 能力契约（模式白名单 / 工具元数据双向一致 / 内部工具可追溯）
        run: node scripts/CI运行测试.mjs 能力契约测试

      - name: 工具元数据契约（白名单覆盖 + 反向无孤儿 + 无第二份清单）
        run: node scripts/CI运行测试.mjs 工具元数据契约测试

      - name: 写锁并发（按文件加锁 / 撞锁退避 / 结构化可重试错误）
        run: node scripts/CI运行测试.mjs 写入锁并发测试

      - name: 恢复隔离（跨实例不误标 recovering / 验证实例运行时隔离）
        run: node scripts/CI运行测试.mjs 恢复隔离测试

      - name: 决策记录索引（无孤儿 ADR / 无空文件 / 头部元信息齐全）
        run: node scripts/CI运行测试.mjs 决策记录索引守护测试

      - name: 长期规范索引（规范层无孤儿 / 头部元信息齐全 / 生效规范有引用）
        run: node scripts/CI运行测试.mjs 规范索引守护测试

      - name: 事件发射点（注册表里的事件必须有真实发射点）
        run: node scripts/CI运行测试.mjs 事件发射点守护测试

      - name: 输入栏与工作区面板收敛（上下文/审批并入输入栏；工作区入口为面板）
        run: node scripts/CI运行测试.mjs 工作区面板与输入栏收敛测试

      - name: 会话收敛与流水线状态（跳过/修订不再画叉；思考跟随；记忆后不追问）
        run: node scripts/CI运行测试.mjs 会话收敛与流水线状态测试

      - name: ask 超时与跳过（30 分钟窗口 / 自动回执 / 跳过继续）
        run: node scripts/CI运行测试.mjs ask超时与跳过测试

      - name: 后台任务（2 分钟阈值 / 完成回执 / 取消 / 重启中断）
        run: node scripts/CI运行测试.mjs 后台任务测试

      - name: 原生文本编辑（简单段落/样式走原生，批注等仍走 CLI）
        run: node scripts/CI运行测试.mjs 原生文本编辑测试

      - name: 编辑流水线（docx/pptx / sourceMarkdown / 长 requirements）
        run: node scripts/CI运行测试.mjs 编辑流水线测试

      - name: 产物文件类型图标（docx 等按类型出图，不回退通用图标）
        run: node scripts/CI运行测试.mjs 产物图标测试

      - name: 跨标签页长连接配额（全局满额时面板流让位，必需流不拒）
        run: node scripts/CI运行测试.mjs 跨标签页流配额测试

      - name: 构建版本守卫（部署新构建后旧页面必须被提示刷新）
        run: node scripts/CI运行测试.mjs 构建版本守卫测试

      - name: 会话加载 TDZ（不得先用后声明 / 历史优先显示 / 失败带堆栈）
        run: node scripts/CI运行测试.mjs 会话加载TDZ回归测试

      - name: 会话恢复与中断一致性（resume 幂等 / ask 结算 / 排队可见性 / 精确匹配）
        run: node scripts/CI运行测试.mjs 会话恢复与中断一致性测试

      - name: 会话归档（默认隐藏 / 设置归档历史 / 批量归档与恢复）
        run: node scripts/CI运行测试.mjs 会话归档测试

      - name: 上下文单次读取（运行宪法 / 祖先研发宪法过滤 / AGENTS.md 不重复）
        run: node scripts/CI运行测试.mjs 上下文单次读取测试

      - name: 工作区初始化（AGENTS.md + memory 种子 / 幂等不覆盖）
        run: node scripts/CI运行测试.mjs 工作区初始化测试

      - name: 任务复杂度与技能策略（简单默认 / 复杂发现 / 草稿确认）
        run: node scripts/CI运行测试.mjs 任务复杂度与技能策略测试



      - name: Office 写作闸门通电（ADR 0012 / 工具书 / 环境预检）
        run: node scripts/CI运行测试.mjs Office写作闸门通电测试

      - name: Office 样式预置（create 预置样式集 / 样式错误增强）
        run: node scripts/CI运行测试.mjs Office样式预置测试

      - name: Office 引用预检（引用抽取 / 缺失预检 / 父目录）
        run: node scripts/CI运行测试.mjs Office引用预检测试

      - name: 预算受限收尾（硬预算后禁止改文件 / 放行收尾交互）
        run: node scripts/CI运行测试.mjs 预算受限收尾测试

      - name: 会话流排版（横向滚动 / 四档缩进 / 加粗字体 / 表格 / 分页 / 切换）
        run: node scripts/CI运行测试.mjs 会话流排版回归测试

      - name: 会话流文本分块（工具卡不切断同一句话 / 权威全文缺口定位）
        run: node scripts/CI运行测试.mjs 会话流文本分块回归测试
